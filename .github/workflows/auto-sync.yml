name: Auto Sync Investing.com Data

on:
  schedule:
    # พยายามทุก 10 นาที — แต่ GitHub throttles scheduled workflows บน public repo
    # ให้ทำงานจริงเพียงไม่กี่ครั้ง/วัน ค่าที่เห็นจริงคือห่างกัน 3.5–6.5 ชั่วโมง
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger anytime

# กันรอบซ้อนกัน (สาเหตุหลักของ push ถูกปฏิเสธ: remote rejected ... commit_refs)
concurrency:
  group: auto-sync-loop
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # GitHub จำกัด 6 ชม./job — ตั้ง window ไว้ 5.5 ชม. เพื่อให้มีรอบถัดไปต่อคิวทันที
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install curl_cffi beautifulsoup4 playwright yfinance
          # Chromium สำหรับ fallback เมื่อ investing.com บล็อก IP ของ runner (403)
          python -m playwright install --with-deps chromium

      - name: Run Live Sync loop (every ~10 min for 5h30)
        env:
          TARGET_SECONDS: '600'   # เป้าหมาย 1 รอบ / 10 นาที (นับจากเริ่มรอบ ไม่ใช่หลังจบงาน)
          WINDOW_MINUTES: '330'   # ระยะเวลาที่ job นี้จะวนซิงก์ ก่อนปล่อยให้รอบถัดไปทำงาน
        run: |
          set -u
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Sync"

          deadline=$(( $(date +%s) + WINDOW_MINUTES * 60 ))
          cycle=0
          div_synced_at=0

          while : ; do
            cycle=$((cycle + 1))
            cycle_start=$(date +%s)
            echo "::group::cycle ${cycle} @ $(date -u +%H:%M:%SZ)"
            python scripts/sync_data.py --market=ALL || echo "[sync] cycle failed (relay 403/HTTP error) — will retry next cycle"

            # หุ้นปันผล: รายชื่อ (screener) + DPS จาก yfinance เปลี่ยนช้า — ซิงก์ทุก ~30 นาที
            now_ts=$(date +%s)
            if [ $(( now_ts - div_synced_at )) -ge 1800 ]; then
              python scripts/sync_dividends.py --limit=30 || echo "[dividends] sync failed — will retry next cycle"
              div_synced_at=$(date +%s)
            fi

            git add thailand_stocks_unmasked.json thailand_stocks_overvalued.json \
                    undervalued_stocks_unmasked.json us_stocks_overvalued.json sync_status.json \
                    dividend_stocks.json dividend_dps_cache.json
            git fetch origin main --quiet || true

            pending=$(git rev-list --count origin/main..HEAD 2>/dev/null || echo 0)
            if git diff --staged --quiet && [ "$pending" = "0" ]; then
              echo "[git] no data changes this cycle"
            else
              git commit -m "chore(sync): automated live stock data update from Investing.com" || true

              pushed=0
              for attempt in 1 2 3 4 5; do
                if git pull --rebase --autostash origin main; then
                  if git push origin HEAD:main; then pushed=1; break; fi
                else
                  git rebase --abort 2>/dev/null || true
                fi
                echo "[git] push attempt ${attempt} failed — retrying in $((attempt * 8))s"
                sleep $((attempt * 8))
              done

              if [ "$pushed" = "1" ]; then
                echo "[git] pushed OK"
              else
                echo "[git] push failed after retries — will retry on next cycle"
              fi
            fi
            echo "::endgroup::"

            [ "$(date +%s)" -ge "$deadline" ] && { echo "[loop] window finished after ${cycle} cycles"; break; }

            now=$(date +%s)
            spent=$(( now - cycle_start ))
            rest=$(( TARGET_SECONDS - spent ))
            [ "$rest" -lt 10 ] && rest=10
            echo "[loop] cycle ${cycle} took ${spent}s — sleeping ${rest}s"
            sleep "$rest"
          done
