name: Auto Sync Investing.com Data

on:
  schedule:
    # Run every 10 minutes (UTC) — a failed dataset (relay 403) self-heals
    # within one cycle instead of leaving stale data for half an hour.
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger anytime

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install curl_cffi beautifulsoup4

      - name: Run Live Sync
        run: |
          python scripts/sync_data.py --market=ALL

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Sync"
          git add thailand_stocks_unmasked.json thailand_stocks_overvalued.json undervalued_stocks_unmasked.json us_stocks_overvalued.json sync_status.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(sync): automated live stock data update from Investing.com"
            # races with other workflows (10 min cadence) -> rebase before push
            git pull --rebase origin main || git pull --rebase --autostash origin main
            git push
          fi
