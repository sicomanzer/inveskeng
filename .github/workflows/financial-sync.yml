name: Financial Details Sync (Popup Data)

on:
  schedule:
    # ทุก 6 ชั่วโมง (UTC) — งบการเงินเปลี่ยนปีละ 4 ครั้ง ใช้ความถี่ต่ำก็พอ
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger anytime

concurrency:
  group: financial-sync
  cancel-in-progress: false

jobs:
  financials:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install thaifin yfinance pandas

      - name: Fetch SET financial details (thaifin)
        continue-on-error: true
        run: |
          python scripts/fetch_financials.py --market=SET

      - name: Fetch US financial details (yfinance)
        continue-on-error: true
        run: |
          python scripts/fetch_financials.py --market=US

      - name: Commit and push changes
        run: |
          set -u
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Sync"
          # financial_status.json แยกไฟล์จาก sync_status.json เพื่อไม่ให้ rebase ชนกับ auto-sync
          git add stock_details_SET.json stock_details_US.json financial_status.json

          if git diff --staged --quiet; then
            echo "[git] no financial changes"
            exit 0
          fi

          git commit -m "chore(financials): refresh popup financial details (thaifin+yfinance)" || true

          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main; then
              if git push origin HEAD:main; then
                echo "[git] pushed OK"
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            echo "[git] push attempt ${attempt} failed — retrying in $((attempt * 8))s"
            sleep $((attempt * 8))
          done

          echo "[git] push failed after retries — next scheduled run will retry"
          exit 0
