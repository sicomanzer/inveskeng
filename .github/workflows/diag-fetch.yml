name: Diag fetch (temporary)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps + chromium
        run: |
          pip install curl_cffi beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Real sync with direct disabled (forces browser path)
        env:
          SYNC_DIRECT_RETRIES: '0'
        run: |
          python scripts/sync_data.py --market=ALL
          echo "--- sync_status.json ---"
          cat sync_status.json
